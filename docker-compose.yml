services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gradely-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Gradely@Pass123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Gradely@Pass123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./Gradely_Api-master
      dockerfile: Dockerfile
    container_name: gradely-api
    ports:
      - "5121:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=GradelyDb;User Id=sa;Password=Gradely@Pass123;TrustServerCertificate=true;"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./student-assignment-portal
      dockerfile: Dockerfile
    container_name: gradely-frontend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5121"
    depends_on:
      - api

volumes:
  sqlserver-data:
